name: Python and JavaScript agree

on:
  push:
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Run both implementations on Gemona 2026 tasks 2 and 3
        run: ./tests/run_consistency.sh
